<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perla Crack Webtoon Panels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="transition-fix.css?v=carriage-line-slim-ae0" />
</head>
<body>
  <main class="page">
    <section class="export-bundle" data-export-name="part_01_before_goodbye">

      <section class="export-panel text-panel intro-panel">
        <div class="record-frame">
          <div class="intro-text">
            무릎 꿇은 나라에도,<br>
            <span class="spring-line">봄은 있었다.</span>
          </div>
        </div>
      </section>

      <section class="export-panel transition-panel intro-to-lake-transition" aria-hidden="true"></section>

      <section class="export-panel image-panel opening-lake-panel lyrical-panel">
        <img src="assets/02_white_lily_closeup.png" alt="백수련 클로즈업" />
        <div class="lake-bottom-fade"></div>
        <div class="narration-box">
          <div class="narration-text">
            세 아이는 알지 못했다.<br>
            그것이, <span class="gold-word">빌려온 봄</span>이라는 걸.
          </div>
        </div>
      </section>

      <section class="export-panel transition-panel lake-to-carriage-transition" aria-hidden="true">
        <div class="vertical-dots"></div>
      </section>

      <section class="export-panel image-panel dark-scene-panel carriage-panel">
        <img src="assets/03_black_carriage_palace.png" alt="검은 마차와 황궁 문" />
        <div class="image-wash cold-wash"></div>
        <div class="overlay"></div>
        <div class="caption">
          <span class="caption-kicker">그해,</span><br>
          <span class="caption-main">봄은 검은 마차에 실려 떠났다.</span>
        </div>
      </section>

      <section class="export-panel transition-panel carriage-to-door-transition" aria-hidden="true"></section>

      <section class="export-panel image-panel dark-scene-panel door-panel">
        <img src="assets/04_carriage_wheel_door.png" alt="닫힌 황궁 문" />
        <div class="image-wash cold-wash"></div>
        <div class="overlay"></div>
        <div class="caption caption-slightly-small">
          막아선 아이는 짓밟혔고,<br>
          지켜본 아이는 무너졌다.<br><br>
          열 살의 두 아이는, 너무 작았다.
        </div>
      </section>

      <section class="export-panel transition-panel door-to-letter-transition" aria-hidden="true"></section>

      <section class="export-panel text-panel letter-panel">
        <div class="paper-grain"></div>
        <div class="text-center letter-text">
          편지는 국경을 넘었다.<br>
          사람만이, 넘지 못했다.
        </div>
      </section>

      <section class="export-panel transition-panel letter-to-goodbye-transition" aria-hidden="true"></section>
    </section>
  </main>
</body>
</html>
